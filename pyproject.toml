[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-visitor-stats"
version = "0.1.0"
description = "Django app: visitor tracking (session dedupe), geo hints, and a Leaflet stats dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "requests>=2.31",
    "user-agents>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["visitor_stats*"]

[tool.setuptools.package-data]
visitor_stats = ["templates/**/*.html"]
